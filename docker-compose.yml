# Development stack: builds locally, reloads on code changes, and keeps its
# data in ./data so it can be inspected and deleted freely.
services:
  web:
    build: .
    container_name: plasmid-editor-dev
    ports:
      - "5001:5001"
    volumes:
      - ./data:/data
      - ./app:/app/app
      - ./dnakit:/app/dnakit
    environment:
      - FLASK_APP=app.main
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - SECRET_KEY=dev-secret-key-change-in-production
      - EDITOR_DATABASE_PATH=/data/plasmid_editor.db
      # Point these at a copy of the MoClo databases to try the shared-library
      # features locally; the app runs fine without them.
      - PARTS_DATABASE_PATH=/data/parts.db
      - MOCLO_DATABASE_PATH=/data/moclo.db
      - MOCLO_BASE_URL=http://localhost:5000
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=devpassword
    restart: unless-stopped
    command: ["python", "-m", "flask", "run", "--host=0.0.0.0", "--port=5001", "--reload"]
